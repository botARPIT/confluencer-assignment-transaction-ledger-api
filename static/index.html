<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confluencer Ledger</title>
  <style>
    :root { font: 16px/1.5 system-ui, sans-serif; color: #172033; background: #f3f6fb; }
    *, *::before, *::after { box-sizing: border-box; }
    body { max-width: 850px; margin: 36px auto; padding: 0 18px; }
    h1 { margin-bottom: 4px; } p { color: #5c6678; }
    .card { background: white; padding: 22px; border-radius: 12px; margin: 18px 0; box-shadow: 0 3px 18px #15213a12; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(170px, 100%), 1fr)); gap: 10px; align-items: end; }
    label { display: grid; gap: 5px; font-size: 14px; min-width: 0; }
    input, select, button { min-width: 0; width: 100%; font: inherit; padding: 10px; border: 1px solid #cbd3df; border-radius: 7px; }
    button { background: #2755d9; color: white; border: 0; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; border-bottom: 1px solid #e6e9ef; padding: 9px 5px; }
    #message { min-height: 1.5em; }
    @media(max-width:520px) { table { font-size: 13px; } }
  </style>
</head>
<body>
  <h1>Transaction Ledger</h1><p>Create an account, apply credits or debits, and inspect its balance and history.</p>
  <section class="card"><h2>Create account</h2><form id="account-form"><label>Account holder name<input name="name" required maxlength="120"></label><button>Create account</button></form></section>
  <section class="card"><h2>Account</h2><form id="lookup-form"><label>Account ID<input id="account-id" required placeholder="Paste account UUID"></label><button>Load account</button></form><h3 id="account-summary">No account loaded</h3></section>
  <section class="card"><h2>Add transaction</h2><form id="transaction-form">
    <label>Type<select name="type"><option value="credit">Credit</option><option value="debit">Debit</option></select></label>
    <label>Amount<input name="amount" type="number" min="0.01" step="0.01" required></label>
    <label>Description<input name="description" maxlength="500" required></label>
    <label>Reference ID<input name="reference_id" maxlength="100" required></label><button>Add transaction</button>
  </form></section>
  <section class="card"><h2>Transfer between accounts</h2><form id="transfer-form">
    <label>From account ID<input name="source_account_id" required></label>
    <label>To account ID<input name="destination_account_id" required></label>
    <label>Amount<input name="amount" type="number" min="0.01" step="0.01" required></label>
    <label>Description<input name="description" maxlength="500" required></label>
    <label>Reference ID<input name="reference_id" maxlength="100" required></label><button>Transfer</button>
  </form></section>
  <section class="card"><h2>Transaction history</h2>
    <form id="history-form">
      <label>Type<select name="type"><option value="">All</option><option value="credit">Credit</option><option value="debit">Debit</option></select></label>
      <label>Page<input name="page" type="number" min="1" value="1" required></label>
      <label>Page size<input name="limit" type="number" min="1" max="500" value="100" required></label>
      <button>Load history</button>
    </form>
    <p id="history-summary"></p><div id="history">Load an account to view history.</div>
  </section>
  <p id="message" role="status"></p>
  <script>
    const $ = (id) => document.getElementById(id);
    const API_BASE_URL = new URLSearchParams(window.location.search).get('api')?.replace(/\/$/, '')
      || (window.location.protocol === 'file:' ? 'http://localhost:8000' : window.location.origin);
    const message = (text, error = false) => { $('message').textContent = text; $('message').style.color = error ? '#b42318' : '#18794e'; };
    const accountId = () => $('account-id').value.trim();
    async function request(path, options = {}) {
      const response = await fetch(`${API_BASE_URL}${path}`, { ...options, headers: { 'Content-Type': 'application/json', ...(options.headers || {}) } });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || `Request failed (${response.status})`);
      return data;
    }
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
    async function loadAccount() {
      const account = await request(`/accounts/${accountId()}`);
      $('account-summary').textContent = `Account ${account.account_id} — balance ${account.balance}`;
      await loadHistory();
    }
    async function loadHistory() {
      const formData = new FormData($('history-form'));
      if (!formData.get('type')) formData.delete('type');
      const params = new URLSearchParams(formData);
      const result = await request(`/accounts/${accountId()}/transactions?${params}`);
      $('history-summary').textContent = result.total_records ? `Page ${result.page} of ${result.total_pages} · ${result.total_records} transaction(s)` : 'No transactions found.';
      $('history').innerHTML = result.transactions.length ? `<table><thead><tr><th>When</th><th>Type</th><th>Amount</th><th>Description</th><th>Reference</th></tr></thead><tbody>${result.transactions.map(row => `<tr><td>${new Date(row.created_at).toLocaleString()}</td><td>${row.type}</td><td>${row.amount}</td><td>${escapeHtml(row.description)}</td><td>${escapeHtml(row.reference_id)}</td></tr>`).join('')}</tbody></table>` : 'No transactions on this page.';
    }
    $('account-form').addEventListener('submit', async event => { event.preventDefault(); try { const data = Object.fromEntries(new FormData(event.target)); const account = await request('/accounts', { method: 'POST', body: JSON.stringify(data) }); $('account-id').value = account.id; window.alert('Account created successfully.'); await loadAccount(); message('Account created.'); } catch (error) { message(error.message, true); } });
    $('lookup-form').addEventListener('submit', async event => { event.preventDefault(); try { await loadAccount(); message('Account loaded.'); } catch (error) { message(error.message, true); } });
    $('history-form').addEventListener('submit', async event => { event.preventDefault(); try { await loadHistory(); } catch (error) { message(error.message, true); } });
    $('transaction-form').addEventListener('submit', async event => { event.preventDefault(); try { const transaction = await request(`/accounts/${accountId()}/transactions`, { method: 'POST', body: JSON.stringify(Object.fromEntries(new FormData(event.target))) }); event.target.reset(); window.alert(`${transaction.type === 'credit' ? 'Credit' : 'Debit'} transaction added successfully.`); await loadAccount(); message('Transaction added.'); } catch (error) { message(error.message, true); } });
    $('transfer-form').addEventListener('submit', async event => { event.preventDefault(); try { const transfer = await request('/transfers', { method: 'POST', body: JSON.stringify(Object.fromEntries(new FormData(event.target))) }); window.alert(`Transfer of ${transfer.amount} completed successfully.`); if ([transfer.source_account_id, transfer.destination_account_id].includes(accountId())) await loadAccount(); message('Transfer completed.'); } catch (error) { message(error.message, true); } });
  </script>
</body>
</html>
